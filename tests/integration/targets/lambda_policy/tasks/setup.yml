- name: Create a role
  amazon.aws.iam_role:
    name: "{{ iam_role_name }}"
    assume_role_policy_document:
      Version: '2012-10-17'
      Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
    managed_policies:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole

- name: Wait for role to be usable
  pause:
    seconds: 10

- name: Gather account facts
  aws_account_facts:

- name: Create a Lambda package
  lambda_package:
    src: "{{ role_path }}/files/lambda"
    dest: "{{ output_dir }}/lambda.zip"

- name: Create a Lambda function
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ output_dir }}/lambda.zip"
    runtime: python3.8
    timeout: 60
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_arn }}"
    publish: yes
    qualifier: "test"
  register: lambda_function
