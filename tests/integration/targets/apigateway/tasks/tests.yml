- name: Attempt to create an API when a naming conflict exists
  apigateway:
    stage_name: "{{ stage }}"
    swagger: "{{ swagger | to_nice_json }}"
  ignore_errors: yes
  register: create_conflict
  vars:
    api_name: "{{ conflicting_api_name }}"
    stage: demo
    swagger: "{{ original_swagger }}"

- name: Create for demo stage
  include_tasks: create.yml
  vars:
    stage: demo
    swagger: "{{ original_swagger }}"

- name: Create for test stage
  include_tasks: create.yml
  vars:
    stage: test
    swagger: "{{ original_swagger }}"

- name: Create for test stage with updated swagger
  include_tasks: create.yml
  vars:
    stage: test
    swagger: "{{ updated_swagger }}"

- name: Delete the API Gateway deployment (check)
  apigateway:
    api_name: "{{ api_name }}"
    state: absent
  check_mode: yes
  register: delete_check

- name: Delete the API Gateway deployment (changed)
  apigateway:
    api_name: "{{ api_name }}"
    state: absent
  register: delete_changed

- name: Delete the API Gateway deployment (unchanged)
  apigateway:
    api_name: "{{ api_name }}"
    state: absent
  register: delete_unchanged

- name: Check results
  assert:
    that:
      - create_conflict is failed
      - create_conflict.msg == expected_conflict_message
      - delete_check is changed
      - delete_changed is changed
      - delete_unchanged is not changed
  vars:
    expected_conflict_message: api name '{{ conflicting_api_name }}' is ambiguous
