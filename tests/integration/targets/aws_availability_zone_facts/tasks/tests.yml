- name: Gather availability zone facts
  aws_availability_zone_facts:

- name: Check results
  assert:
    that:
      - aws_availability_zones | length > 0
      - aws_availability_zones[0].region_name | length > 0
      - aws_availability_zones[0].zone_name| length > 0
      - aws_availability_zones[0].state | length > 0
