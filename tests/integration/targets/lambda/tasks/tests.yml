- name: Create a Lambda function (check)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ original_zip }}"
    runtime: "{{ runtime }}"
    timeout: 60
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_arn }}"
    publish: yes
    qualifier: "{{ function_alias }}"
    layers:
      - "{{ lambda_layer.layer.layer_version_arn }}"
    environment: "{{ simple_env }}"
  check_mode: yes
  register: create_check

- name: Create a Lambda function (changed)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ original_zip }}"
    runtime: "{{ runtime }}"
    timeout: 60
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_arn }}"
    publish: yes
    qualifier: "{{ function_alias }}"
    layers:
      - "{{ lambda_layer.layer.layer_version_arn }}"
    environment: "{{ simple_env }}"
  register: create_changed

- name: Alias the Lambda function to support qualifier change detection
  lambda_alias:
    name: "{{ function_alias }}"
    description: "test alias"
    function_name: "{{ function_name }}"
    version: "{{ create_changed.meta.version }}"
  register: create_alias

- name: Create a Lambda function (unchanged)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ original_zip }}"
    runtime: "{{ runtime }}"
    timeout: 60
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_arn }}"
    publish: no  # publishing would force an update and thus report changed
    qualifier: "{{ function_alias }}"
    layers:
      - "{{ lambda_layer.layer.layer_version_arn }}"
    environment: "{{ simple_env }}"
  register: create_unchanged

- name: Update a Lambda function config (check)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ original_zip }}"
    runtime: "{{ runtime }}"
    timeout: 30
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_arn }}"
    publish: yes
    layers:
      - "{{ lambda_layer.layer.layer_version_arn }}"
    environment: "{{ simple_env }}"
  check_mode: yes
  register: update_config_check

- name: Update a Lambda function config (changed)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ original_zip }}"
    runtime: "{{ runtime }}"
    timeout: 30
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_arn }}"
    publish: yes
    layers:
      - "{{ lambda_layer.layer.layer_version_arn }}"
    environment: "{{ simple_env }}"
  register: update_config_changed

- name: Update a Lambda function config (unchanged)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ original_zip }}"
    runtime: "{{ runtime }}"
    timeout: 30
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_arn }}"
    publish: no  # publishing would force an update and thus report changed
    layers:
      - "{{ lambda_layer.layer.layer_version_arn }}"
    environment: "{{ simple_env }}"
  register: update_config_unchanged

- name: Update a Lambda function code (check)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ updated_zip }}"
    runtime: "{{ runtime }}"
    timeout: 30
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_arn }}"
    publish: yes
    layers:
      - "{{ lambda_layer.layer.layer_version_arn }}"
    environment: "{{ simple_env }}"
  check_mode: yes
  register: update_code_check

- name: Update a Lambda function code (changed)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ updated_zip }}"
    runtime: "{{ runtime }}"
    timeout: 30
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_arn }}"
    publish: yes
    layers:
      - "{{ lambda_layer.layer.layer_version_arn }}"
    environment: "{{ simple_env }}"
  register: update_code_changed

- name: Update a Lambda function code (unchanged)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ updated_zip }}"
    runtime: "{{ runtime }}"
    timeout: 30
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_arn }}"
    publish: no  # publishing would force an update and thus report changed
    layers:
      - "{{ lambda_layer.layer.layer_version_arn }}"
    environment: "{{ simple_env }}"
  register: update_code_unchanged

- name: Update a Lambda function config and code (check)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ original_zip }}"
    runtime: "{{ runtime }}"
    timeout: 60
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_name }}"
    publish: yes
    qualifier: "{{ function_alias }}"
    preserve_environment: yes
  check_mode: yes
  register: update_check

- name: Update a Lambda function config and code (changed)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ original_zip }}"
    runtime: "{{ runtime }}"
    timeout: 60
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_name }}"
    publish: yes
    qualifier: "{{ function_alias }}"
    preserve_environment: yes
  register: update_changed

- name: Alias the Lambda function to support qualifier change detection
  lambda_alias:
    name: "{{ function_alias }}"
    description: "test alias"
    function_name: "{{ function_name }}"
    version: "{{ update_changed.meta.version }}"
  register: update_code_alias

- name: Update a Lambda function config and code (unchanged)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ original_zip }}"
    runtime: "{{ runtime }}"
    timeout: 60
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_name }}"
    publish: no  # publishing would force an update and thus report changed
    qualifier: "{{ function_alias }}"
    preserve_environment: yes
  register: update_unchanged

- name: Delete the created Lambda function alias
  lambda_alias:
    name: "test"
    function_name: "{{ function_name }}"
    state: absent

- name: Update Lambda function to use custom logging (check)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ updated_zip }}"
    runtime: "{{ runtime }}"
    timeout: 60
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_arn }}"
    publish: yes
    log_format: JSON
    log_group: "/aws/lambda/{{ function_name }}-custom"
    application_log_level: debug
    system_log_level: warn
  check_mode: yes
  register: logging_check

- name: Update Lambda function to use custom logging (changed)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ updated_zip }}"
    runtime: "{{ runtime }}"
    timeout: 60
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_arn }}"
    publish: yes
    log_format: JSON
    log_group: "/aws/lambda/{{ function_name }}-custom"
    application_log_level: debug
    system_log_level: warn
  register: logging_changed

- name: Update Lambda function to use custom logging (unchanged)
  lambda:
    name: "{{ function_name }}"
    local_path: "{{ updated_zip }}"
    runtime: "{{ runtime }}"
    timeout: 60
    handler: lambda_function.lambda_handler
    memory_size: 128
    role: "{{ iam_role_arn }}"
    publish: no  # publishing would force an update and thus report changed
    log_format: JSON
    log_group: "/aws/lambda/{{ function_name }}-custom"
    application_log_level: debug
    system_log_level: warn
  register: logging_unchanged

- name: Delete a Lambda function version (check)
  lambda:
    name: "{{ function_name }}"
    qualifier: "{{ create_changed.meta.version }}"
    state: absent
  check_mode: yes
  register: delete_version_check

- name: Delete a Lambda function version (changed)
  lambda:
    name: "{{ function_name }}"
    qualifier: "{{ create_changed.meta.version }}"
    state: absent
  register: delete_version_changed

- name: Delete a Lambda function version (unchanged)
  lambda:
    name: "{{ function_name }}"
    qualifier: "{{ create_changed.meta.version }}"
    state: absent
  register: delete_version_unchanged

- name: Delete a Lambda function (check)
  lambda:
    name: "{{ function_name }}"
    state: absent
  check_mode: yes
  register: delete_check

- name: Delete a Lambda function (changed)
  lambda:
    name: "{{ function_name }}"
    state: absent
  register: delete_changed

- name: Delete a Lambda function (unchanged)
  lambda:
    name: "{{ function_name }}"
    state: absent
  register: delete_unchanged

- name: Check results
  assert:
    that:
      - create_check is changed
      - create_check.meta.log_format == 'Text'
      - create_check.meta.log_group == ("/aws/lambda/" + function_name)
      - create_check.meta.layers == [lambda_layer.layer.layer_version_arn]
      - create_check.meta.environment == simple_env
      - create_check.meta.version == "1"  # version prediction for creation
      - create_changed is changed
      - create_changed.meta.log_format == 'Text'
      - create_changed.meta.log_group == ("/aws/lambda/" + function_name)
      - create_changed.meta.layers == [lambda_layer.layer.layer_version_arn]
      - create_changed.meta.environment == simple_env
      - create_changed.meta.version == "1"
      - create_unchanged is not changed
      - create_unchanged.meta.log_format == 'Text'
      - create_unchanged.meta.log_group == ("/aws/lambda/" + function_name)
      - create_unchanged.meta.layers == [lambda_layer.layer.layer_version_arn]
      - create_unchanged.meta.environment == simple_env
      - create_unchanged.meta.version == "1"  # version unchanged with qualifier
      - update_config_check is changed
      - update_config_check.meta.log_format == 'Text'
      - update_config_check.meta.log_group == ("/aws/lambda/" + function_name)
      - update_config_check.meta.layers == [lambda_layer.layer.layer_version_arn]
      - update_config_check.meta.environment == simple_env
      - update_config_check.meta.version == "$LATEST"  # no version prediction in check mode with changes
      - update_config_changed is changed
      - update_config_changed.meta.log_format == 'Text'
      - update_config_changed.meta.log_group == ("/aws/lambda/" + function_name)
      - update_config_changed.meta.layers == [lambda_layer.layer.layer_version_arn]
      - update_config_changed.meta.environment == simple_env
      - update_config_changed.meta.version == "2"
      - update_config_unchanged is not changed
      - update_config_unchanged.meta.log_format == 'Text'
      - update_config_unchanged.meta.log_group == ("/aws/lambda/" + function_name)
      - update_config_unchanged.meta.layers == [lambda_layer.layer.layer_version_arn]
      - update_config_unchanged.meta.environment == simple_env
      - update_config_unchanged.meta.version == "$LATEST"  # no version prediction without qualifier
      - update_code_check is changed
      - update_code_check.meta.log_format == 'Text'
      - update_code_check.meta.log_group == ("/aws/lambda/" + function_name)
      - update_code_check.meta.layers == [lambda_layer.layer.layer_version_arn]
      - update_code_check.meta.environment == simple_env
      - update_code_check.meta.version == "$LATEST"  # no version prediction in check mode with changes
      - update_code_changed is changed
      - update_code_changed.meta.log_format == 'Text'
      - update_code_changed.meta.log_group == ("/aws/lambda/" + function_name)
      - update_code_changed.meta.layers == [lambda_layer.layer.layer_version_arn]
      - update_code_changed.meta.environment == simple_env
      - update_code_changed.meta.version == "3"
      - update_code_unchanged is not changed
      - update_code_unchanged.meta.log_format == 'Text'
      - update_code_unchanged.meta.log_group == ("/aws/lambda/" + function_name)
      - update_code_unchanged.meta.layers == [lambda_layer.layer.layer_version_arn]
      - update_code_unchanged.meta.environment == simple_env
      - update_code_unchanged.meta.version == "$LATEST"  # no version prediction without qualifier
      - update_check is changed
      - update_check.meta.log_format == 'Text'
      - update_check.meta.log_group == ("/aws/lambda/" + function_name)
      - update_check.meta.layers == []
      - update_check.meta.environment == simple_env
      - update_check.meta.version == "$LATEST"  # no version prediction in check mode with changes
      - update_changed is changed
      - update_changed.meta.log_format == 'Text'
      - update_changed.meta.log_group == ("/aws/lambda/" + function_name)
      - update_changed.meta.layers == []
      - update_changed.meta.environment == simple_env
      - update_changed.meta.version == "4"
      - update_unchanged is not changed
      - update_unchanged.meta.log_format == 'Text'
      - update_unchanged.meta.log_group == ("/aws/lambda/" + function_name)
      - update_unchanged.meta.layers == []
      - update_unchanged.meta.environment == simple_env
      - update_unchanged.meta.version == "4"
      - logging_check is changed
      - logging_check.meta.log_format == 'JSON'
      - logging_check.meta.application_log_level == 'debug'
      - logging_check.meta.system_log_level == 'warn'
      - logging_check.meta.log_group == ("/aws/lambda/" + function_name + "-custom")
      - logging_check.meta.environment == {}
      - logging_check.meta.version == "$LATEST"  # no version prediction in check mode with changes
      - logging_changed is changed
      - logging_changed.meta.log_format == 'JSON'
      - logging_changed.meta.application_log_level == 'debug'
      - logging_changed.meta.system_log_level == 'warn'
      - logging_changed.meta.log_group == ("/aws/lambda/" + function_name + "-custom")
      - logging_changed.meta.environment == {}
      - logging_changed.meta.version == "5"
      - logging_unchanged is not changed
      - logging_unchanged.meta.log_format == 'JSON'
      - logging_unchanged.meta.application_log_level == 'debug'
      - logging_unchanged.meta.system_log_level == 'warn'
      - logging_unchanged.meta.log_group == ("/aws/lambda/" + function_name + "-custom")
      - logging_unchanged.meta.environment == {}
      - logging_unchanged.meta.version == "$LATEST"  # no version prediction without qualifier
      - delete_version_check is changed
      - delete_version_changed is changed
      - delete_version_unchanged is not changed
      - delete_check is changed
      - delete_changed is changed
      - delete_unchanged is not changed
